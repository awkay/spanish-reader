name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: scripts/install-android-sdk.sh

      - name: Test
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APKs
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
          cp app/build/outputs/apk/release/app-release.apk "spanish-reader-${VERSION_CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "spanish-reader-${VERSION_CODE}-debug-fallback.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spanish Reader build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Install `spanish-reader-${{ github.run_number }}.apk` (small, R8-shrunk release build).
            The `-debug-fallback.apk` is the unshrunk build, only for if the small one misbehaves.
            Built from ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: |
            spanish-reader-${{ github.run_number }}.apk
            spanish-reader-${{ github.run_number }}-debug-fallback.apk
