# nginx site for spanish-reader.fulcrologic.com. Static files are served by nginx; /api goes to the Go server.
# Certificates: after `certbot --nginx -d spanish-reader.fulcrologic.com`, certbot fills in the ssl_* lines and the
# port-80 redirect (or adapt to however the other sites on this server get their certificates).
server {
    listen 80;
    listen [::]:80;
    server_name spanish-reader.fulcrologic.com;

    root /opt/spanish-reader/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI lookups and audio generation can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }

    # Always revalidate the entry points so updates arrive; versioned assets (?v=build) can be cached.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=604800";
    }
}
